<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <base href="/">
    <title>Bingo Interactif</title>
    <meta name="description" content="Application de bingo interactif. Créez et gérez vos grilles de bingo personnalisées de 3x3 à 5x5.">
    <meta name="keywords" content="bingo, interactif, jeu, grille, nintendo, catégorie, personnalisé">
    <meta name="author" content="Bryan Drouet">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#CC0000">
    <meta property="og:title" content="Bingo Interactif">
    <meta property="og:description" content="Créez et jouez à des bingos interactifs personnalisés.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="fr_FR">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Bingo Interactif">
    <meta name="twitter:description" content="Créez et jouez à des bingos interactifs personnalisés.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        const v = Date.now();
        document.write(`<link rel="stylesheet" href="css/style.css?v=${v}">`);
    </script>
</head>
<body>
    <div id="app" aria-live="polite" aria-atomic="false"></div>

    <div id="cookie-banner" class="cookie-banner hidden" role="dialog" aria-label="Consentement aux cookies" aria-modal="true" aria-describedby="cookie-desc">
        <p id="cookie-desc">Ce site utilise des cookies essentiels pour l'authentification Google et la sauvegarde de vos données. <a href="/politique-confidentialite/" class="link link--muted">Politique de confidentialité</a></p>
        <div class="cookie-actions">
            <button type="button" id="cookie-decline" class="btn btn--ghost-light">Refuser</button>
            <button type="button" id="cookie-accept" class="btn btn--primary">Accepter</button>
        </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="assertive" aria-atomic="true"></div>

    <div id="app-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="app-modal-title" aria-describedby="app-modal-message">
        <div class="modal-content modal-content--sm">
            <div class="modal-header">
                <h2 id="app-modal-title"></h2>
                <button type="button" id="app-modal-close" class="btn btn--ghost-dark btn--sm btn--icon" aria-label="Fermer la fenêtre">
                    <i data-lucide="x" aria-hidden="true"></i>
                </button>
            </div>
            <div class="modal-body">
                <p id="app-modal-message"></p>
                <div class="modal-actions">
                    <button type="button" id="app-modal-cancel" class="btn btn--neutral">Annuler</button>
                    <button type="button" id="app-modal-confirm" class="btn btn--primary">Confirmer</button>
                </div>
            </div>
        </div>
    </div>

    <a href="/mentions-legales/" id="info-fab" class="btn btn--dark btn--icon btn--round btn--fab" aria-label="Ouvrir les mentions légales" title="Mentions légales">
        <i data-lucide="info" aria-hidden="true"></i>
    </a>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script>
        window.__FIREBASE_CONFIG__ = window.__FIREBASE_CONFIG__ || {};

        const cacheBust = Date.now();
        const isLocalHost = ["localhost", "127.0.0.1"].includes(window.location.hostname);

        function loadScript(src, options = {}) {
            return new Promise((resolve, reject) => {
                const script = document.createElement("script");
                script.src = src;
                if (options.type) script.type = options.type;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error(`Failed to load ${src}`));
                document.head.appendChild(script);
            });
        }

        async function bootstrapApp() {
            if (isLocalHost) {
                try {
                    await loadScript(`js/firebase-config.local.js?v=${cacheBust}`);
                } catch {
                    await loadScript(`js/firebase-config.js?v=${cacheBust}`);
                }
            } else {
                await loadScript(`js/firebase-config.js?v=${cacheBust}`);
            }

            await loadScript(`js/notifications.js?v=${cacheBust}`);
            await loadScript(`js/app.js?v=${cacheBust}`, { type: "module" });
        }

        bootstrapApp().catch(error => {
            console.error(error);
        });
    </script>
</body>
</html>
